name: Release

# Conventional-Commit-driven releases, fully in CI. On every push to `main`,
# semantic-release inspects the commits since the last release and, when they
# warrant one (feat → minor, fix → patch, a `BREAKING CHANGE:` footer → major
# — the default commit-analyzer preset reads the footer, not a `!` marker):
#   - runs the full gate (typecheck / test / reproducible bundle),
#   - computes the next version and stamps it across package.json / src/version.ts /
#     SKILL.md / CHANGELOG.md and rebuilds the bundle (scripts/stamp-version.mjs),
#   - commits the bump back to `main` as `chore(release): <v> [skip ci]`,
#   - tags `v<version>` and creates the GitHub release with auto notes + tarball.
# No npm-registry publish (GitHub release only) — uses the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # push the bump commit + tag, create the release
  issues: write # semantic-release comments on released issues/PRs
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, required to analyze commits since last release
          persist-credentials: true # let @semantic-release/git push the bump commit

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `lint` script in this repository. Everything else ci.yml gates is
      # gated here too: a release job that starts on the same push as CI does
      # not wait for it, so a gate only CI runs is a gate a release can skip.
      - name: Gate — typecheck / test / reproducible bundle
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run check:build

      # Kept out of the vitest glob on purpose: an eval regression and a
      # coverage regression should never share an exit code.
      - name: The corpus benchmark holds its floors
        run: pnpm bench --ci

      - name: The committed benchmark report matches a fresh run
        run: git diff --exit-code -- bench/REPORT.md bench/report.json

      - name: The engine runs standalone
        run: |
          node skills/ultrai18n/scripts/ultrai18n.mjs version
          node skills/ultrai18n/scripts/ultrai18n.mjs census --repo . --json > /dev/null

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
