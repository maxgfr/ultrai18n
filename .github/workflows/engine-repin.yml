name: Engine re-pin

# Watches maxgfr/codeindex for a new release and re-pins it here — both halves of
# the pin at once: the fork base under src/vendor/, and the npm package that tsup
# inlines into the shipped bundle along with its .wasm grammars.
#
# All gates green -> pushed straight to main (no PR, no human in the loop).
# Any gate red -> nothing is pushed and no PR is opened; the run just fails and
# the next daily cron retries. A red run is the signal to investigate, and the
# most likely reason is the one the engine cannot decide for you: the fork base
# moved, so one of the ULTRAI18N deltas has to be re-applied by hand.
on:
  schedule:
    - cron: '41 6 * * *' # daily; minute offset staggered per repo to spread load
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency: engine-repin

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The gitignore parity test shells out to `git check-ignore` and the
          # census denominator is `git ls-files` — same reason as ci.yml.
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect current pin vs. latest codeindex release
        id: detect
        run: |
          set -euo pipefail
          PINNED=$(node -p "require('./src/vendor/engine.meta.json').tag")
          # NOT releases/latest: the codeindex repo also carries non-version
          # asset releases, which /releases/latest could surface.
          LATEST=$(gh api repos/maxgfr/codeindex/releases --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "up to date ($PINNED)"
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "new release: $PINNED -> $LATEST"
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      # Fails, loudly and with the upstream diff, when the fork base moved. That
      # is not a failure to route around: it means walk.ts / ignore.ts / glob.ts /
      # util.ts changed under a fork that carries four deliberate deltas.
      - name: Re-pin engine
        if: steps.detect.outputs.up_to_date != 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          node scripts/sync-engine.mjs --ref "$LATEST"
          node scripts/sync-engine.mjs --check

      # The dependency is pinned exactly, so this moves the lockfile and nothing
      # else. --frozen-lockfile is deliberately not used here: this step IS the
      # lockfile update, and every other job in this repo keeps it frozen.
      - name: Move the lockfile onto the new pin
        if: steps.detect.outputs.up_to_date != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.up_to_date != 'true'
        run: pnpm typecheck

      # Rebuilds the bundle (codeindex is inlined into it) and re-copies the
      # .wasm grammars from the new package. Both are committed artifacts, so
      # they are staged and travel in the re-pin commit.
      - name: Rebuild the bundle and grammars, and stage them
        if: steps.detect.outputs.up_to_date != 'true'
        run: |
          pnpm build
          git add -A

      # ci.yml gates the committed bundle with `git diff --exit-code`, which a
      # re-pin would trivially fail — it changes the bundle on purpose. The claim
      # worth keeping is the one underneath it: a build from this tree is
      # reproducible. So build a SECOND time and diff the working tree against
      # what was just staged.
      - name: The rebuilt bundle is reproducible
        if: steps.detect.outputs.up_to_date != 'true'
        run: |
          pnpm build
          git diff --exit-code -- skills/ultrai18n/scripts/

      - name: Test
        if: steps.detect.outputs.up_to_date != 'true'
        run: pnpm test 2>&1 | tee test-output.log

      # Holds the corpus floors AND rewrites bench/REPORT.md + report.json, so
      # any change in WHAT THE TOOL FINDS lands in the re-pin commit as a
      # reviewable prose diff instead of surfacing as a red CI run afterwards.
      - name: The corpus benchmark holds its floors
        if: steps.detect.outputs.up_to_date != 'true'
        run: pnpm bench --ci

      - name: The engine runs standalone
        if: steps.detect.outputs.up_to_date != 'true'
        run: |
          node skills/ultrai18n/scripts/ultrai18n.mjs version
          node skills/ultrai18n/scripts/ultrai18n.mjs census --repo . --json > /dev/null

      - name: Configure git identity
        if: steps.detect.outputs.up_to_date != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push the re-pin to main (all gates green)
        if: steps.detect.outputs.up_to_date != 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          COUNTS=$(grep -E '^\s*(Test Files|Tests)\s' test-output.log || echo "test counts unavailable")
          rm -f test-output.log
          git add -A
          git commit -m "feat(engine): re-pin codeindex ${LATEST}" \
            -m "automated re-pin, all gates green, fork base unchanged" \
            -m "$COUNTS"
          git pull --rebase origin main
          git push origin HEAD:main

      # A push authenticated with the default GITHUB_TOKEN does not trigger other
      # workflows (known GH Actions limitation) — trigger CI explicitly.
      - name: Trigger CI on the new main
        if: steps.detect.outputs.up_to_date != 'true'
        run: gh workflow run ci.yml --ref main
