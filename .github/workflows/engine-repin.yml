name: Engine re-pin

# Watches maxgfr/codeindex for a new release and re-pins it here — both halves of
# the pin at once: the fork base under src/vendor/, and the npm package that tsup
# inlines into the shipped bundle along with its .wasm grammars.
#
# All gates green -> pushed straight to main (no PR, no human in the loop).
# Any gate red -> nothing is pushed and no PR is opened; the run just fails and
# the next daily cron retries. A red run is the signal to investigate, and the
# most likely reason is the one the engine cannot decide for you: the fork base
# moved, so one of the ULTRAI18N deltas has to be re-applied by hand.
on:
  schedule:
    - cron: '41 6 * * *' # daily; minute offset staggered per repo to spread load
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency: engine-repin

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The gitignore parity test shells out to `git check-ignore` and the
          # census denominator is `git ls-files` — same reason as ci.yml.
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Driven by `sync-engine.mjs --list` rather than by a copy of the engine
      # table kept here: adding an engine to the script is then the only edit
      # needed, and the automation cannot drift from the list it is watching.
      - name: Re-pin every engine that has a newer release
        id: detect
        run: |
          set -euo pipefail
          SUMMARY=""
          while read -r NAME REPO PINNED; do
            # NOT releases/latest: a repo may also publish non-engine asset
            # releases (codeindex publishes embed-model-v1), which are not tags
            # this can pin to.
            LATEST=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "::error::could not determine the latest ${NAME} release tag"
              exit 1
            fi
            if [ "$PINNED" = "$LATEST" ]; then
              echo "${NAME}: up to date (${PINNED})"
              continue
            fi
            echo "${NAME}: ${PINNED} -> ${LATEST}"
            node scripts/sync-engine.mjs --engine "$NAME" --ref "$LATEST"
            SUMMARY="${SUMMARY}${NAME} ${PINNED} -> ${LATEST}"$'\n'
          done < <(node scripts/sync-engine.mjs --list)

          if [ -z "$SUMMARY" ]; then
            echo "repin=false" >> "$GITHUB_OUTPUT"
          else
            echo "repin=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              printf '%s' "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the vendored engines match their new pins
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/sync-engine.mjs --check

      - name: Move the lockfile onto the new pin
        if: steps.detect.outputs.repin == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.repin == 'true'
        run: pnpm typecheck

      # Rebuilds the bundle (codeindex is inlined into it) and re-copies the
      # .wasm grammars from the new package. Both are committed artifacts, so
      # they are staged and travel in the re-pin commit.
      - name: Rebuild the bundle and grammars, and stage them
        if: steps.detect.outputs.repin == 'true'
        run: |
          pnpm build
          git add -A

      # ci.yml gates the committed bundle with `git diff --exit-code`, which a
      # re-pin would trivially fail — it changes the bundle on purpose. The claim
      # worth keeping is the one underneath it: a build from this tree is
      # reproducible. So build a SECOND time and diff the working tree against
      # what was just staged.
      - name: The rebuilt bundle is reproducible
        if: steps.detect.outputs.repin == 'true'
        run: |
          pnpm build
          git diff --exit-code -- skills/ultrai18n/scripts/

      - name: Test
        if: steps.detect.outputs.repin == 'true'
        run: pnpm test 2>&1 | tee test-output.log

      # Holds the corpus floors AND rewrites bench/REPORT.md + report.json, so
      # any change in WHAT THE TOOL FINDS lands in the re-pin commit as a
      # reviewable prose diff instead of surfacing as a red CI run afterwards.
      - name: The corpus benchmark holds its floors
        if: steps.detect.outputs.repin == 'true'
        run: pnpm bench --ci

      - name: The engine runs standalone
        if: steps.detect.outputs.repin == 'true'
        run: |
          node skills/ultrai18n/scripts/ultrai18n.mjs version
          node skills/ultrai18n/scripts/ultrai18n.mjs census --repo . --json > /dev/null

      - name: Configure git identity
        if: steps.detect.outputs.repin == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push the re-pin to main (all gates green)
        if: steps.detect.outputs.repin == 'true'
        env:
          ENGINES: ${{ steps.detect.outputs.summary }}
        run: |
          set -euo pipefail
          COUNTS=$(grep -E '^\s*(Test Files|Tests)\s' test-output.log || echo "test counts unavailable")
          rm -f test-output.log
          # printf, not a multi-line literal: this file's indentation would
          # otherwise be baked into the commit body.
          BODY=$(printf '%s%s\n' "${ENGINES}" "$COUNTS")
          git add -A
          git commit -m "feat(engine): re-pin vendored engines" \
            -m "automated re-pin, all gates green, fork base unchanged" \
            -m "$BODY"
          git pull --rebase origin main
          git push origin HEAD:main

      # A push authenticated with the default GITHUB_TOKEN does not trigger other
      # workflows (known GH Actions limitation) — trigger CI explicitly.
      - name: Trigger CI on the new main
        if: steps.detect.outputs.repin == 'true'
        run: gh workflow run ci.yml --ref main

      # A red re-pin means this repo has stopped following the engine. Nothing
      # used to carry that signal out of the Actions tab, so ultrasec failed
      # three nights running in August before a human noticed. One open issue per
      # repo, a comment on each further failure, closed by the first green run.
      - name: Report the failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create engine-repin --color B60205 --description "This automated pin needs a human" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          # Built with printf rather than a multi-line literal: this file's own
          # indentation would otherwise be carried into the body and render the
          # whole message as a code block.
          BODY=$(printf '%s\n\n%s\n' \
            "The daily engine-repin run failed: ${RUN}" \
            "Nothing was pushed, so main is not broken — the pin is simply frozen where it was, and this repo stays behind the engine until someone looks.")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "${{ github.workflow }} is failing" --label engine-repin --body "$BODY"
          fi

      - name: Close the tracking issue once a run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then exit 0; fi
          gh issue close "$NUM" --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
